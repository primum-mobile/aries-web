<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aries — Astrology Software</title>
<meta name="description" content="Aries — fast and easy-to-use astrology software. Request access to the private beta." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<meta property="og:title" content="Aries — Astrology Software" />
<meta property="og:description" content="Fast and Easy-to-use Astrology Software. Private beta — request access." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://aries.sh/" />

<style>
  /* FreeSans — same family the Aries desktop app ships */
  @font-face {
    font-family: 'FreeSans';
    src: url('/fonts/FreeSans.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'FreeSans';
    src: url('/fonts/FreeSansBold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg-app:        #0a0c11;
    --bg-pill:       rgba(0, 0, 0, 0.42);
    --bg-pill-focus: rgba(0, 0, 0, 0.55);

    --text-primary:   #f4f4f5;
    --text-secondary: #b2b7c0;
    --text-muted:     #8f95a0;
    --label-muted:    #6f7782;

    --accent-gold:  #c5a36d;

    --border-pill:        rgba(255, 255, 255, 0.10);
    --border-pill-focus:  rgba(255, 255, 255, 0.22);

    --stack-sans: 'FreeSans', 'Nimbus Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: var(--stack-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* Very subtle ambient glow — keeps the page from feeling flat */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 35%, rgba(255, 255, 255, 0.035), transparent 70%),
      radial-gradient(ellipse 60% 50% at 50% 90%, rgba(197, 163, 109, 0.035), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── frame ─────────────────────────────────────────── */
  .frame {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 28px;
    z-index: 1;
  }

  /* ─── hero ──────────────────────────────────────────── */
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    max-width: 520px;
    margin: auto;
  }

  /* The wordmark mirrors the app's splash: leftmost "A" is sheared
     19° to the right (false italic), the rest is upright. */
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    font-weight: 400;
    font-size: clamp(64px, 11vw, 124px);
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--text-primary);
    margin-bottom: 20px;
    opacity: 0;
    animation: rise 700ms cubic-bezier(.2,.7,.2,1) 120ms forwards;
  }
  .wordmark .a {
    display: inline-block;
    transform: skewX(-19deg);
    transform-origin: bottom left;
    margin-right: 0.04em;
  }

  .tagline {
    font-weight: 400;
    font-size: clamp(14px, 1.6vw, 17px);
    line-height: 1.55;
    color: var(--text-secondary);
    margin-bottom: 40px;
    opacity: 0;
    animation: rise 700ms cubic-bezier(.2,.7,.2,1) 260ms forwards;
  }

  /* ─── floating pill input (mirrors spotlight_ambient.py) ── */
  .pill {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 60px;
    display: flex;
    align-items: center;
    border: 1px solid var(--border-pill);
    background: var(--bg-pill);
    border-radius: 9999px;
    padding: 0 8px 0 22px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow:
      0 18px 50px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: border-color 220ms ease, background 220ms ease, box-shadow 220ms ease;
    opacity: 0;
    animation: rise 700ms cubic-bezier(.2,.7,.2,1) 400ms forwards;
  }
  .pill:focus-within {
    border-color: var(--border-pill-focus);
    background: var(--bg-pill-focus);
  }

  .pill .icon {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    color: var(--label-muted);
    margin-right: 14px;
  }

  .pill input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-family: var(--stack-sans);
    font-size: 17px;
    letter-spacing: 0.005em;
    border: 0; outline: 0;
    background: transparent;
    color: var(--text-primary);
    padding: 0;
  }
  .pill input::placeholder { color: var(--label-muted); }

  /* Defeat Chrome/Safari autofill background paint — the default pale
     yellow/blue ruins the dark pill. The long transition pushes the
     autofill background change far enough into the future that users
     never see it; the inset shadow paints over what slips through. */
  .pill input:-webkit-autofill,
  .pill input:-webkit-autofill:hover,
  .pill input:-webkit-autofill:focus,
  .pill input:-webkit-autofill:active {
    -webkit-text-fill-color: var(--text-primary);
    -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.42) inset;
    caret-color: var(--text-primary);
    transition: background-color 600000s 0s, color 600000s 0s;
  }

  .pill button {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    margin-left: 8px;
    border: 0;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 200ms ease, color 200ms ease, transform 220ms cubic-bezier(.2,.7,.2,1);
  }
  .pill button:hover {
    background: var(--text-primary);
    color: #0a0c11;
  }
  .pill button:disabled { opacity: 0.45; cursor: not-allowed; }
  .pill button .arrow { width: 14px; height: 10px; transition: transform 220ms cubic-bezier(.2,.7,.2,1); }
  .pill button:hover .arrow { transform: translateX(2px); }

  /* ─── caption under the pill ───────────────────────── */
  .caption {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--label-muted);
    text-align: center;
    opacity: 0;
    animation: rise 700ms cubic-bezier(.2,.7,.2,1) 520ms forwards;
  }
  .caption .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-gold);
    box-shadow: 0 0 8px rgba(197, 163, 109, 0.55);
    vertical-align: middle;
    margin-right: 8px;
    transform: translateY(-1px);
  }

  /* ─── confirmation state ───────────────────────────── */
  .confirm {
    display: none;
    text-align: center;
    padding: 6px 0;
    width: 100%;
    max-width: 480px;
  }
  .confirm .check {
    width: 28px; height: 28px;
    margin: 0 auto 14px;
    color: var(--accent-gold);
  }
  .confirm h3 {
    font-weight: 400;
    font-size: 18px;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: 0.005em;
  }
  .confirm p {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--label-muted);
  }
  .is-sent .pill,
  .is-sent .caption { display: none; }
  .is-sent .confirm { display: block; animation: rise 500ms cubic-bezier(.2,.7,.2,1) forwards; }

  /* ─── footer (tiny credit, almost invisible) ───────── */
  footer {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 22px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--label-muted);
    pointer-events: none;
    z-index: 1;
  }
  footer span, footer a {
    pointer-events: auto;
    color: inherit;
    text-decoration: none;
    transition: color 200ms ease;
  }
  footer a:hover { color: var(--text-primary); }
  footer .sep { color: rgba(255, 255, 255, 0.12); }

  /* ─── animations ───────────────────────────────────── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .wordmark, .tagline, .pill, .caption { opacity: 1; }
  }

  /* ─── small screens ────────────────────────────────── */
  @media (max-width: 560px) {
    .pill { height: 56px; padding: 0 6px 0 18px; }
    .pill input { font-size: 16px; }
    .pill button { width: 42px; height: 42px; }
    footer { font-size: 9px; gap: 14px; }
  }

  /* EmailOctopus loader host — visually hidden offscreen but still
     accessible to JS so we can pull the email value through it. */
  #eo-host {
    position: fixed;
    left: -10000px; top: 0;
    width: 1px; height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="frame">
    <main>
      <h1 class="wordmark" aria-label="Aries">
        <span class="a">A</span><span>RIES</span>
      </h1>

      <p class="tagline">Fast and Easy-to-use Astrology Software</p>

      <form class="pill" id="form" novalidate>
        <!-- thin globe glyph, matches the spotlight's armillary icon -->
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="10" r="7.5"/>
          <path d="M2.5 10h15"/>
          <path d="M10 2.5c2.5 2.6 2.5 12.4 0 15"/>
          <path d="M10 2.5c-2.5 2.6-2.5 12.4 0 15"/>
        </svg>
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="your email"
          required
          spellcheck="false"
          aria-label="email"
        />
        <button type="submit" id="submit" aria-label="Request access">
          <svg class="arrow" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 5h12M9 1l4 4-4 4"/>
          </svg>
        </button>
      </form>

      <div class="caption">
        <span class="dot"></span>Private beta &middot; invitations sent in waves
      </div>

      <div class="confirm" id="confirm" aria-live="polite">
        <svg class="check" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 14l6 6L23 8"/>
        </svg>
        <h3>You're on the list.</h3>
        <p>Thank you</p>
      </div>
    </main>

    <!-- EmailOctopus official loader. Their JS injects a full form here
         (with their cookies/tokens). We hide it visually and drive its
         submit from the visible pill above. This is their supported
         integration shape, so submissions pass every server-side check. -->
    <div id="eo-host" aria-hidden="true">
      <script async
              src="https://eomail5.com/form/3ed5cabe-5579-11f1-ab27-77502d76e5d3.js"
              data-form="3ed5cabe-5579-11f1-ab27-77502d76e5d3"></script>
    </div>

    <footer>
      <span>© MMXXVI Max Lange</span>
      <span class="sep">·</span>
      <a href="mailto:support@aries.sh">support@aries.sh</a>
    </footer>
  </div>

<script>
  // The visible pill is the UI; the real form is the one EmailOctopus's
  // loader injects into #eo-host. On submit we poll for that injected
  // form, copy the email into its field_0 input (using the React/Vue
  // -friendly native setter so any framework-controlled state updates),
  // and click their submit button — letting EmailOctopus's own JS run
  // the validation and POST exactly the way they expect. As a hard
  // safety net, if their form hasn't appeared within 2.5s we navigate
  // the user to EmailOctopus's hosted page so the signup is never lost.

  const HOSTED_FALLBACK = 'https://eomail5.com/form/3ed5cabe-5579-11f1-ab27-77502d76e5d3';

  const form   = document.getElementById('form');
  const main   = document.querySelector('main');
  const email  = document.getElementById('email');
  const submit = document.getElementById('submit');
  const pill   = form;

  function flashError() {
    email.focus();
    pill.style.borderColor = 'rgba(197, 163, 109, 0.6)';
    pill.style.background  = 'rgba(197, 163, 109, 0.08)';
    setTimeout(() => {
      pill.style.borderColor = '';
      pill.style.background  = '';
    }, 1300);
  }

  function findEOControls() {
    const host = document.getElementById('eo-host');
    if (!host) return null;
    const emailInput =
      host.querySelector('input[name="field_0"]') ||
      host.querySelector('input[type="email"]');
    const submitBtn =
      host.querySelector('button[type="submit"]') ||
      host.querySelector('input[type="submit"]');
    if (emailInput && submitBtn) return { emailInput, submitBtn };
    return null;
  }

  async function waitForEO(timeoutMs = 2500) {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      const ctrl = findEOControls();
      if (ctrl) return ctrl;
      await new Promise(r => setTimeout(r, 80));
    }
    return null;
  }

  function setNativeValue(el, value) {
    // Bypass React/Vue controlled-input shims so the framework reads
    // the new value when we dispatch the input event.
    const proto = Object.getPrototypeOf(el);
    const setter = Object.getOwnPropertyDescriptor(proto, 'value');
    if (setter && setter.set) setter.set.call(el, value);
    else el.value = value;
    el.dispatchEvent(new Event('input',  { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = email.value.trim();
    if (!value || !/^\S+@\S+\.\S+$/.test(value)) {
      flashError();
      return;
    }
    submit.disabled = true;

    const eo = await waitForEO();
    if (!eo) {
      // EO loader never showed up (ad-blocker, network glitch) — send
      // the visitor to EmailOctopus's hosted form so they can still
      // sign up. Their hosted page accepts the email param prefilled.
      window.location.href = HOSTED_FALLBACK + '?field_0=' + encodeURIComponent(value);
      return;
    }

    try {
      setNativeValue(eo.emailInput, value);
      eo.submitBtn.click();
      main.classList.add('is-sent');
    } catch (err) {
      submit.disabled = false;
      flashError();
    }
  });
</script>
</body>
</html>
